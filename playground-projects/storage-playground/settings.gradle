pluginManagement {
    apply from: "../../playground-common/configure-plugin-management.gradle", to: it
}
plugins {
    id "playground"
}
apply from: "../../buildSrc/ndk.gradle"
rootProject.name = "storage-playground"

playground {
    setupPlayground("../..")
    def projects = [
        ":room3:room3-common", ":room3:room3-runtime", ":room3:room3-paging",
        ":room3:room3-compiler", ":room3:room3-compiler-processing",
        ":room3:room3-external-antlr", ":room3:room3-migration",
        ":room3:integration-tests:mingwtestapp",
        ":sqlite:sqlite", ":sqlite:sqlite-async", ":sqlite:sqlite-framework", ":sqlite:sqlite-bundled",
        ":datastore:datastore-core", ":datastore:datastore-core-okio",
        ":internal-testutils-datastore", ":kruth:kruth",
    ] as Set
    selectProjectsFromAndroidX({ name -> projects.contains(name) })
}
