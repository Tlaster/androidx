name: MinGW storage

on:
  push:
    branches: [androidx-main]
    paths:
      - 'room3/**'
      - 'sqlite/**'
      - 'datastore/**'
      - 'testutils/testutils-datastore/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'playground-common/**'
      - 'playground-projects/storage-playground/**'
      - 'settings.gradle'
      - '.github/workflows/mingw-storage.yml'
  pull_request:
    paths:
      - 'room3/**'
      - 'sqlite/**'
      - 'datastore/**'
      - 'testutils/testutils-datastore/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'playground-common/**'
      - 'playground-projects/storage-playground/**'
      - 'settings.gradle'
      - '.github/workflows/mingw-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mingw-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-compile Windows and test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: /tmp/androidx-storage-out
    defaults:
      run:
        shell: bash
        working-directory: playground-projects/storage-playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install the upstream NDK
        run: |
          ndk_version=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' ../../buildSrc/ndk.gradle)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version"
      - name: Verify configuration with Windows disabled
        run: |
          ./gradlew :room3:integration-tests:mingwtestapp:tasks \
            -Pandroidx.enabled.kmp.target.platforms=-WINDOWS --no-configuration-cache
      - name: Compile the nine storage libraries and Windows tests
        run: |
          modules=(
            room3:room3-common room3:room3-runtime room3:room3-paging
            sqlite:sqlite sqlite:sqlite-async sqlite:sqlite-framework sqlite:sqlite-bundled
            datastore:datastore-core datastore:datastore-core-okio
          )
          tasks=()
          for module in "${modules[@]}"; do
            tasks+=(":$module:compileKotlinMingwX64")
          done
          ./gradlew "${tasks[@]}" \
            :room3:room3-runtime:linkDebugTestMingwX64 \
            :datastore:datastore-core:linkDebugTestMingwX64 \
            :room3:integration-tests:mingwtestapp:linkDebugTestMingwX64 \
            --no-configuration-cache --stacktrace
      - name: Run existing Linux regression tests
        run: |
          ./gradlew :room3:room3-runtime:linuxX64Test \
            :datastore:datastore-core:linuxX64Test \
            --no-configuration-cache --stacktrace
      - name: Upload Windows test executables
        uses: actions/upload-artifact@v4
        with:
          name: mingw-test-executables
          path: ${{ env.OUT_DIR }}/**/build/bin/mingwX64/debugTest/*.exe
          if-no-files-found: error
      - name: Upload MinGW libraries
        uses: actions/upload-artifact@v4
        with:
          name: mingw-storage-klibs
          path: ${{ env.OUT_DIR }}/**/build/classes/kotlin/mingwX64/main/klib/**
          if-no-files-found: error
      - name: Upload Linux test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-storage-test-reports
          path: ${{ env.OUT_DIR }}/**/build/test-results/**

  windows:
    name: Execute native storage tests on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mingw-test-executables
          path: tests
      - name: Run every native test executable
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests -Recurse -Filter '*.exe')
          if ($tests.Count -ne 3) { throw "Expected 3 test executables, found $($tests.Count)" }
          New-Item -ItemType Directory -Force reports | Out-Null
          $failed = @()
          foreach ($test in $tests) {
            $name = $test.FullName.Substring((Resolve-Path tests).Path.Length).TrimStart('\', '/') -replace '[\\/]', '-'
            & $test.FullName 2>&1 | Tee-Object -FilePath "reports/$name.log"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          if ($failed.Count -gt 0) { throw "Failed native tests: $($failed -join ', ')" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-storage-test-reports
          path: reports
